root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["swag init -g cmd/api/main.go --parseDependency --parseInternal -o docs"]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "migrations", "docs"]
  delay = 1000
  stop_on_error = true

[misc]
  clean_on_exit = true